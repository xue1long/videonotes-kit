[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidwise"
version = "0.3.0"
description = "LLMs can't watch videos. vidwise gives them eyes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Juan Pablo Djeredjian" },
]
keywords = ["video", "transcript", "whisper", "frames", "llm", "ai", "knowledge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

# 上游 vidwise 的依赖：保留为本仓库的"vitrine"（src/vidwise/ 仍可用 --guide 路径，
# 想用的人可装含 anthropic/openai 的 [guide] extras；本仓库工具链（notes.py /
# toolkit/）走 --no-guide 路径不需要这些）。
dependencies = [
    "click>=8.0",
    "openai-whisper>=20231117",
    "yt-dlp>=2023.0",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
# 上游 --guide 路径（用 vision LLM 抄屏）才需要的 SDK；lazy import 不会
# 在不装的情况下触发，但在调用时会失败。videonotes-kit 工具链不需要。
guide = [
    "anthropic>=0.40",
    "openai>=1.0",
]
# 本仓库真正用得到：faster-whisper 比 openai-whisper 快 5-10x；离线转写必需
fast = ["faster-whisper>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
vidwise = "vidwise.cli:main"

[project.urls]
Homepage = "https://github.com/jpdjere/vidwise"
Repository = "https://github.com/jpdjere/vidwise"
Issues = "https://github.com/jpdjere/vidwise/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vidwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
