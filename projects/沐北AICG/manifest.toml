# ---- Tier2 可选本地 LLM 精校（默认关，不影响纯本地链路） ----
# 仅当本机接入本地对话/视觉模型（如 Ollama 暴露 OpenAI 兼容接口）时启用。
# enabled=false 时 curate 不调用任何网络，draft 半成品保持原样待人工润色。
# 启用后：notes curate 会对每步正文调用 base_url 的 /v1/chat/completions 做润色；
# 调用失败或超时自动回退原文，不阻断管线。
[llm]
enabled = false
base_url = "http://127.0.0.1:11434"
model = "qwen2.5:7b"
api_key_env = ""
timeout = 60
