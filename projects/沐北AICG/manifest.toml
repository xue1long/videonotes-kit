# ---- 教程导向文案（index「如何使用本教程」段，manifest 驱动，无需手改） ----
learning_path = "本教程分两套：①**基础系列**（01–05）打工具与流程认知，零基础先建立「AI 视频零件」概念；②**失焦系列**（06–10）以「失焦」这部 AI 电影为完整案例的进阶实战，美术与镜头语言密度高。**推荐顺序：按序号 01→10 通读**，先基础后失焦；若只看实战可直奔失焦系列，但建议先扫一遍基础_3（机械飞升流）建立「产物皆来自大模型」的创作观。"
series_note = "「基础」与「失焦」是沐北两套独立课程：基础讲通用零件与流程；失焦以单部 AI 电影（失焦）为贯穿案例，失焦一 / 失焦二 为同一案例的上下篇（一 = 前期剧本分镜美术，二 = 后期资产收尾 / 剪辑 / 调色）。"

# ---- 术语对照（黑话 → 真实含义；index 自动生成「术语对照」段） ----
[[course.glossary]]
term = "九宫格 / 九宫阁"
meaning = "把提示词拆成 3×3 九张分镜图的生图 / 排版法"
[[course.glossary]]
term = "垫图"
meaning = "图生图时先放一张参考图，让结果沿用其构图 / 角色"
[[course.glossary]]
term = "转会"
meaning = "图生图二次生成（基于已有图改细节）"
[[course.glossary]]
term = "首尾针"
meaning = "两段不连贯视频之间补 4–6 秒衔接镜头"
[[course.glossary]]
term = "锁针"
meaning = "生视频时锁定某一参考帧 / 元素不变"
[[course.glossary]]
term = "抽卡"
meaning = "用随机种子批量生成多张图再挑满意的（圈内说法）"
[[course.glossary]]
term = "抽脸"
meaning = "从生成图里提取干净的人物面部"
[[course.glossary]]
term = "洗图"
meaning = "用超分 / 重绘把「脏图」修干净"
[[course.glossary]]
term = "定妆照"
meaning = "人物设定图，用于固定角色外观"
[[course.glossary]]
term = "风镜的风诀"
meaning = "小说转剧本 / 分镜的专属指令"
[[course.glossary]]
term = "即梦 / 吉梦"
meaning = "字节即梦（Seedance 2.0 视频生成）"
[[course.glossary]]
term = "Nano Banana（大香蕉）"
meaning = "Google 图像生成模型（Gemini 系）"
[[course.glossary]]
term = "Gemini"
meaning = "Google 多模态大模型"
[[course.glossary]]
term = "Codex"
meaning = "OpenAI Codex，片中用来改图、写 Skill、出 LUT 提示词"
[[course.glossary]]
term = "Meet Journey"
meaning = "生图工具（Midjourney 类，拼团）"
[[course.glossary]]
term = "MiniMax"
meaning = "TTS 语音合成"
[[course.glossary]]
term = "大波罗"
meaning = "生视频工具（课程黑话，具体产品以视频为准）"

[draft]
max_steps = 80
gap = 45.0

